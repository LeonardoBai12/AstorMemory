name: Test and Coverage Verification

on:
  pull_request:

jobs:
  coverage-verification:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo $GOOGLE_SERVICES > memory-game/core/google-services.json

      - name: Validate coverage
        run: ./gradlew jacocoProjectCoverageVerification

      - name: Generate Tests Report (If JUnit finds violations)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AstorMemory-Test-Report
          path: 'build/reports/tests/test/'

      - name: Upload Unit Tests Coverage Report (If JaCoCo finds violations)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AstorMemory-Coverage-Report
          path: 'build/reports/jacoco/test/html/'